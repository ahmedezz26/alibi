[project]
name = "agent-alibi"
version = "0.1.2"
description = "We check whether your agent has an alibi for what it did."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "langchain-typesafe>=0.0.1a2",
    "langsmith>=0.12.6",
    "mcp>=2.2,<3",
    "numpy>=2.5.3",
    "openai>=3.16.0",
    "pyarrow>=25.0.1",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
]

[project.urls]
Homepage = "https://github.com/ahmedezz26/alibi"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# The distribution is "agent-alibi" on PyPI ("alibi" is taken); the import package stays "alibi".
[tool.uv.build-backend]
module-name = "alibi"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# `ruff format` rewrites python code blocks inside markdown, which mangles the docs.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
alibi = "alibi.cli:main"
alibi-mcp = "alibi.mcp_server:main"
