name: Publish release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      # A release must be rebuildable from its tag, and must not collide with a published one.
      - name: Check the version is tagged and unpublished
        run: |
          version=$(uv version --short)
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Refusing to release from ${GITHUB_REF}: tag the commit as v${version} first." >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}." >&2
            exit 1
          fi
          if curl -sf "https://pypi.org/pypi/agent-alibi/${version}/json" >/dev/null; then
            echo "agent-alibi ${version} is already on PyPI; bump the version." >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py
      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

      - name: Upload distributions as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Download distributions artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish
        run: uv publish

      # The plugin runs the PyPI artifact, so prove that artifact starts.
      - name: Verify the published distribution
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 10); do
            uv run --isolated --no-project --refresh \
              --with "agent-alibi==${version}" python -c "
import alibi.mcp_server as m
print('published', m.build_server().name)
" && exit 0
            echo "not on the index yet, retrying"; sleep 15
          done
          exit 1
